<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Prezzo sceso</title></head>
<body style="font-family: Arial, sans-serif; color: #0f172a; background: #f8fafc; padding: 24px;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px;">
    <p>Ciao {{nome}},</p>
    <p>il prezzo di <strong>{{titolo}}</strong> &egrave; sceso a <strong>{{prezzo}}</strong>,
       sotto la soglia di {{soglia}} che avevi impostato.</p>
    <p><a href="{{linkAuto}}" style="color: #1d4ed8;">Vedi l'annuncio</a></p>
    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;">
    <p style="font-size: 12px; color: #64748b;">
      Non vuoi pi&ugrave; ricevere avvisi per questa auto?
      <a href="{{linkDisattiva}}" style="color: #64748b;">Disattiva l'avviso</a>.
    </p>
  </div>
</body>
</html>
