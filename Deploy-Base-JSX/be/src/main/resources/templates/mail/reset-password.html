<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reimposta la password</title></head>
<body style="font-family: Arial, sans-serif; color: #10201f; background: #f4f7f7; padding: 24px;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #c8d4d6; border-radius: 8px; padding: 24px;">
    <p>Ciao <span th:text="${nome}">Mario</span>,</p>
    <p>abbiamo ricevuto una richiesta per reimpostare la password del tuo account.</p>
    <p><a th:href="${link}" href="#" style="display: inline-block; background: #0e6f7a; color: #ffffff; padding: 10px 16px; border-radius: 6px; text-decoration: none;">Reimposta la password</a></p>
    <p style="font-size: 12px; color: #5f7071;">
      Il link vale <span th:text="${durata}">120 minuti</span> e si pu&ograve; usare una volta sola.
      Se non sei stato tu, ignora questa mail: la password resta quella di prima.
    </p>
  </div>
</body>
</html>
