# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# Rinominare app-db / app-be / app-fe con il nome del progetto.

databases:
  - name: app-db
    databaseName: app
    user: app
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: app-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      # Origine del FE per il CORS, es. https://app-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Indirizzo del FE per i link nelle mail (stesso valore di ALLOWED_ORIGIN)
      - key: FE_URL
        sync: false
      # Chiave di firma dei JWT: la genera Render, non sta nella repo
      - key: JWT_SECRET
        generateValue: true
      # Gmail: indirizzo e password per le app (mai nella repo)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Account amministratore creato al primo avvio
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # 50 annunci di esempio: spenti in produzione. Per una demo online: "true".
      - key: APP_SEED_AUTO
        value: "false"

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: app-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://app-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Intestazioni di sicurezza del sito statico. La CSP ammette solo i nostri
    # script: un eventuale codice iniettato non verrebbe eseguito (e non potrebbe
    # leggere il token in localStorage). connect-src: il backend su onrender.com.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
