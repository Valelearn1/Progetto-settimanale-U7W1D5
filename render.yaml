# Blueprint Render di Mole Motors: database + backend + frontend.
# Su Render: New > Blueprint > questa repository > Apply.
# I percorsi partono dalla radice della repo: il progetto sta in Deploy-Base-JSX/.

databases:
  - name: mole-motors-db
    databaseName: mole_motors
    user: mole_motors
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: mole-motors-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: Deploy-Base-JSX/be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - Deploy-Base-JSX/be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mole-motors-db
          property: connectionString
      # Indirizzo ESATTO del frontend (CORS), es. https://mole-motors-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Lo stesso indirizzo: serve ai link nelle mail
      - key: FE_URL
        sync: false
      # Chiave di firma dei JWT: la genera Render, non sta nella repo
      - key: JWT_SECRET
        generateValue: true

      # ---- Mail ----
      # Il piano free di Render blocca le porte SMTP 25/465/587 (usate da Gmail):
      # si usa Brevo sulla porta 2525, che resta aperta. Per usare Gmail serve un
      # piano a pagamento: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587.
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      # Login SMTP e chiave SMTP di Brevo (mai nella repo)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Mittente: un indirizzo verificato su Brevo (Senders & IP > Senders)
      - key: MAIL_FROM
        sync: false

      # Account amministratore creato al primo avvio
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # 50 annunci di esempio al primo avvio (database vuoto). "false" per un catalogo vuoto.
      - key: APP_SEED_AUTO
        value: "true"

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: mole-motors-fe
    runtime: static
    rootDir: Deploy-Base-JSX/fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - Deploy-Base-JSX/fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://mole-motors-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Intestazioni di sicurezza del sito statico. La CSP ammette solo i nostri
    # script: un eventuale codice iniettato non verrebbe eseguito (e non potrebbe
    # leggere il token in localStorage). connect-src: il backend su onrender.com.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
